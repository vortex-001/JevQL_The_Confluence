{% extends "base.html" %}

{% block title %}Create Account — JevQL{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem;">
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">Create your JevQL Account</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">Start exploring natural language database search.</p>
    
    <form method="POST" action="{% url 'authentication:signup' %}">
      {% csrf_token %}
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Username</label>
        <input type="text" name="username" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.95rem;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Email</label>
        <input type="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.95rem;">
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Password</label>
        <input type="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.95rem;">
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">Create Account</button>
    </form>
    
    <p style="margin-top: 1.25rem; font-size: 0.85rem; text-align: center; color: var(--text-secondary);">
      Already have an account? <a href="{% url 'authentication:login' %}" style="color: var(--accent-burnt-orange); font-weight: 600; text-decoration: none;">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
